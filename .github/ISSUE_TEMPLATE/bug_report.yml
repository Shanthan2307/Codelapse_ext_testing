name: 🐞 Bug report
description: Something in CodeLapse didn't work, crashed, or looked wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This repository is **public**, so please don't paste private code or personal information.
  - type: dropdown
    id: area
    attributes:
      label: Which part of CodeLapse?
      options:
        - Installing the extension
        - Choosing the folder / status bar
        - Recording while coding
        - Test runs on the timeline
        - Timelapse replay
        - Report (metrics, activity chart, summary)
        - Export HTML report
        - Save Session Data to Folder
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw. If there was an error message, copy it here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it happen again, list the steps.
      placeholder: |
        1. Chose the studyboard folder
        2. Edited client/src/App.jsx
        3. Stopped recording and pressed Play
        4. ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a short screen recording
      description: Drag files into this box. They help a lot.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: editor-version
    attributes:
      label: Editor and version
      description: "VS Code: Help → About (on macOS: Code → About Visual Studio Code)."
      placeholder: VS Code 1.105.0
